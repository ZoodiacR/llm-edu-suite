name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Unit + behavioural tests (fake LLMs; the Ollama integration tests skip themselves)
        env:
          LANGSMITH_TRACING: "false"
        run: pytest -q -m "not ollama"
      - name: Smoke-train a tiny LM
        run: python scripts/train.py --steps 30 --d-model 64 --n-layers 2 --eval-every 15 --out runs/ci
      - name: MCP server answers over stdio
        run: |
          python - <<'EOF'
          import asyncio, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command=sys.executable, args=["scripts/mcp_server.py"])
              async with stdio_client(params) as (read, write), ClientSession(read, write) as session:
                  init = await session.initialize()
                  assert init.serverInfo.name == "llm-edu-docs", init.serverInfo
                  tools = {t.name for t in (await session.list_tools()).tools}
                  assert tools == {"search_docs", "calculate", "create_ticket"}, tools
                  result = await session.call_tool("calculate", {"expression": "6*7"})
                  assert not result.isError and result.content[0].text == "42", result

          asyncio.run(main())
          print("MCP server OK")
          EOF
      - name: Rebuild every notebook from its generator (catches syntax errors in the generators)
        run: python tools/build_notebooks.py
      - name: Execute a from-scratch notebook end to end on CPU
        run: python tools/run_notebooks.py 01
      # Notebooks 07-16 call a local LLM through Ollama and train on a GPU, so they are executed on a
      # developer machine and committed with their outputs; CI checks everything that runs without them.
