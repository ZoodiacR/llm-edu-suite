name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Unit + behavioural tests
        run: pytest -q
      - name: Smoke-train a tiny LM
        run: python scripts/train.py --steps 30 --d-model 64 --n-layers 2 --eval-every 15 --out runs/ci
      - name: RAG demo on the sample docs
        run: python scripts/rag_demo.py --docs data/sample_docs --eval data/sample_eval.json
      - name: MCP server answers over stdio
        run: python -c "import sys; sys.path.insert(0, '.'); from llmsuite.mcp import MCPClient, StdioTransport, result_text; c = MCPClient(StdioTransport([sys.executable, 'scripts/mcp_server.py'])); c.initialize(); print(result_text(c.call_tool('calculate', {'expression': '6*7'}))); c.close()"
      - name: Execute the PyTorch-free notebooks (10, 11, 13, 14, 15, 16)
        run: python tools/run_notebooks.py 10 11 13 14 15 16
