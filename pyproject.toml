[project]
name = "llmsuite"
version = "0.1.0"
description = "From-scratch LLM engineering toolkit: transformer, attention variants, MoE, SFT/LoRA/DPO/GRPO, quantization, RAG, agents, recsys, evaluation"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyterlab"]
rag = ["sentence-transformers", "requests"]

[tool.setuptools]
packages = ["llmsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
