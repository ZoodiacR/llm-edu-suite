[project]
name = "llm-edu-suite"
version = "2.0.0"
description = "Learn LLM engineering by building the model in PyTorch and the applications with the tools the industry uses: Hugging Face, LangChain, LangGraph, LangSmith, RAGAS and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3", "numpy>=1.24", "matplotlib>=3.7", "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The application layer: everything the notebooks 07-16 use.
apps = [
    "langchain>=1.4", "langchain-core>=1.7", "langchain-community>=0.4", "langchain-classic>=1.0", "langchain-ollama>=1.1",
    "langchain-text-splitters>=1.0", "langgraph>=1.2", "langsmith>=0.14", "ragas>=0.4",
    "faiss-cpu>=1.8", "rank-bm25>=0.2", "pydantic>=2.0",
    "transformers>=5.0", "peft>=0.21", "trl>=1.17", "datasets>=4.0", "accelerate>=1.0", "optimum-quanto>=0.2",
    "mcp[cli]>=1.24,<2", "langchain-mcp-adapters>=0.3.2",
]
dev = ["pytest>=7.0", "jupyterlab>=4.0", "ipykernel>=6.0", "nbclient>=0.8", "nbformat>=5.7"]

[tool.setuptools]
packages = ["llm_edu_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server with the course models (skipped automatically otherwise)"]
